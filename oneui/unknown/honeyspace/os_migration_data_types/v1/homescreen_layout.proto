edition = "2023";

package honeyspace.os_migration_data_types.v1;

import "honeyspace/os_migration_data_types/v1/apps.proto";
import "honeyspace/os_migration_data_types/v1/export_failure.proto";

option java_multiple_files = true;

// Launcher/Home screen folder
message Folder {
  // The display name of the folder.
  string display_name = 1;
  // The list of apps within the folder.
  repeated App app_list = 2;
}

// Application widget found on the launcher/home screen
message Widget {
  // The height of the widget in number of rows.
  int32 height = 1;
  // The width of the widget in number of columns.
  int32 width = 2;
  // The app that hosts the widget.
  App host_app = 3;
  // The identifier of the widget.
  string widget_identifier = 4;
}

// The concept of a layout item on the launcher/home screen
message LayoutItem {
  // The unique identifier of the layout item.
  int32 id = 1;
  // The row index of the layout item.
  int32 row_index = 2;
  // The column index of the layout item.
  int32 column_index = 3;

  // The specific layout item type.
  oneof layout_item {
    // An app layout item.
    App app = 4;
    // A folder layout item.
    Folder folder = 5;
    // A widget layout item.
    Widget widget = 6;
  }
}

// A page of items found on the launcher/home screen
message Page {
  // The unique identifier of the page.
  int32 id = 1;
  // The number of columns on the page.
  int32 num_of_columns = 2;
  // The number of rows on the page.
  int32 num_of_rows = 3;
  // The list of layout items on the page.
  repeated LayoutItem layout_items = 4;
}

// Whole layout encapsulated in one root message for the launcher/home screen
// layout. This message is also expected as the response for getting the
// /homescreen endpoint.
message Layout {
  // The list of pages in the layout.
  repeated Page pages = 1;
  // The list of items in the bottom bar (hotseat).
  repeated LayoutItem bottom_bar_items = 2;
  ExportFailure export_failure = 3;
}
